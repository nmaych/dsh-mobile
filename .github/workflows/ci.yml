name: CI

# Compile check and offline tests on every push and pull request.
#
# This workflow deliberately has NO signing secrets and NO release steps: it
# must pass on a fork with an empty secrets store. It proves the tree compiles
# and that the release plumbing is coherent.
#
# Publishing is release.yml, triggered by a tag.

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback first: pure Node, no Android SDK, finishes in seconds.
  logic:
    name: Release logic
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Guards the version arithmetic and changelog parsing that release.yml
      # depends on. A regression here would otherwise only surface on a tagged
      # build — after publishing a broken update to every installed app.
      - name: Test release metadata
        run: node test/release-logic.test.mjs

      # Guards the wire contract with the dsh-mobile-connect desktop plugin.
      # A renamed endpoint is invisible to the Kotlin compiler but makes the
      # app unable to pair at all, which is exactly what shipped in 1.1.0.
      - name: Test gateway contract
        run: node test/gateway-contract.test.mjs

      # Guards the wire names behind workspace selection, model switching and
      # token usage. The gateway rejects an args object whose keys do not match
      # the descriptor exactly, so a typo there ships as a feature that silently
      # does nothing.
      - name: Test feature contract
        run: node test/feature-contract.test.mjs

      # Guards the transcript fold — the logic behind "对话显示异常". The event
      # shapes are taken from real session logs, and the per-session lifetime of
      # the dedupe set and tool-call index is what the fix turned on.
      - name: Test session fold
        run: node test/session-fold.test.mjs

      # Guards the three 1.1.3 fixes, all of which compiled fine while broken:
      # transport failures rendering as raw English, a subagent child addressed
      # as a top-level session, and the chip strip collapsing into a column.
      - name: Test 1.1.3 regressions
        run: node test/regression-1.1.3.test.mjs

      # Guards the 1.1.4 fixes, which are the same kind of invisible: a hardcoded
      # status-bar colour that only shows on a light-mode phone, an auto-scroll that
      # cancels the user's drag, a `turn` field that was present in every event and
      # never used, and tool cards headed by a tool's identifier instead of its act.
      - name: Test 1.1.4 regressions
        run: node test/regression-1.1.4.test.mjs

      # Guards repository invariants the build depends on but nothing local can
      # see — chiefly the Gradle wrapper's executable bit, whose absence failed
      # this very job with "./gradlew: Permission denied" (exit 126) while every
      # Windows checkout looked perfectly fine.
      - name: Test repository hygiene
        run: node test/repo-hygiene.test.mjs

  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK 34 and build-tools 34.0.0 are what compileSdk/targetSdk
      # declare. Gradle comes from the wrapper committed in the repo.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper lives in app-project/, not the repository root, because that
      # is where the Gradle build is. See docs/RELEASING.md.
      #
      # `chmod +x` is not redundant with the mode stored in git. The executable
      # bit is easy to lose without noticing — a Windows contributor re-adding
      # the file, a squash that drops modes, an upload through the web UI — and
      # on Windows it is invisible either way (core.filemode=false). Losing it
      # fails this step with `./gradlew: Permission denied` and exit 126, which
      # names neither the file's mode nor the fix. Restoring it here costs
      # nothing and makes the build independent of the mode surviving.
      - name: Assemble debug
        working-directory: app-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: dsh-mobile-debug
          path: app-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
